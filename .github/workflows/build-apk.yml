name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Android files
        run: flutter create . --platforms=android

      # 👇 هذا السطر يفرض تحديث إعدادات الأندرويد لتفادي خطأ الـ Namespace 👇
      - name: Fix Gradle Issues
        run: |
          flutter config --no-analytics
          flutter build apk --release || true
          
      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Stable)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
